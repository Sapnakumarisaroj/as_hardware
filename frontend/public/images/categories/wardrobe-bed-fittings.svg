<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Wardrobe rail with hanger and bed connector fittings">
  <rect width="400" height="300" fill="#F4F0E8"/>
  <ellipse cx="200" cy="258" rx="160" ry="12" fill="#1C1F24" opacity=".08"/>
  <!-- Wardrobe rail with end supports -->
  <rect x="40" y="62" width="250" height="12" rx="6" fill="#B8BFC7"/>
  <rect x="44" y="64" width="242" height="3" rx="1.5" fill="#E2E6EA"/>
  <rect x="30" y="50" width="20" height="36" rx="5" fill="#8D96A1"/>
  <rect x="280" y="50" width="20" height="36" rx="5" fill="#8D96A1"/>
  <!-- Hanger -->
  <g fill="none" stroke="#2A2E35" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M165 68 c0 -14 18 -14 18 -2 c0 8 -8 10 -8 18"/>
    <path d="M175 84 l-70 46 h140 z"/>
  </g>
  <!-- Bed connector plates -->
  <g transform="translate(60 168)">
    <rect width="40" height="74" rx="4" fill="#9AA3AD"/>
    <rect x="44" width="40" height="74" rx="4" fill="#B8BFC7"/>
    <g fill="#6B7480">
      <circle cx="20" cy="14" r="4"/><circle cx="20" cy="60" r="4"/>
      <circle cx="64" cy="14" r="4"/><circle cx="64" cy="60" r="4"/>
    </g>
    <rect x="12" y="30" width="16" height="14" rx="2" fill="#7D8691"/>
    <path d="M52 30 h24 l-6 14 h-12 z" fill="#7D8691"/>
  </g>
  <!-- Cam lock and dowel -->
  <g transform="translate(206 176)">
    <circle cx="30" cy="30" r="28" fill="#C9CED4"/>
    <circle cx="30" cy="30" r="20" fill="#9AA3AD"/>
    <rect x="18" y="27" width="24" height="6" rx="3" fill="#4B525C"/>
    <rect x="70" y="24" width="88" height="12" rx="6" fill="#B8BFC7"/>
    <circle cx="158" cy="30" r="10" fill="#8D96A1"/>
  </g>
  <!-- Wardrobe lift / support bracket -->
  <path d="M318 112 h40 v14 h-26 v60 h-14 z" fill="#2A2E35"/>
  <circle cx="338" cy="119" r="3" fill="#9AA3AD"/><circle cx="325" cy="170" r="3" fill="#9AA3AD"/>
</svg>
