    <rect x="88" y="10" width="18" height="6" rx="3" fill="#FFFFFF" opacity=".8"/>
  </g>
  <!-- Work glove -->
  <g transform="translate(272 96)">
    <path d="M18 150 v-68 a10 10 0 0 1 20 0 v-34 a10 10 0 0 1 20 0 v-8 a10 10 0 0 1 20 0 v8 a10 10 0 0 1 20 0 v62 l14 -22 a10 10 0 0 1 17 10 l-26 52 v0 z" fill="#E8E2D2" stroke="#C9C2B4" stroke-width="2"/>
    <path d="M18 104 h96" stroke="#C9C2B4" stroke-width="2"/>
    <rect x="14" y="148" width="92" height="24" rx="6" fill="#F5A300"/>
    <rect x="14" y="156" width="92" height="4" fill="#D98F00"/>
  </g>
