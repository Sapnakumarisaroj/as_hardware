<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Safety helmet, gloves and goggles">
  <rect width="400" height="300" fill="#F4F0E8"/>
  <ellipse cx="200" cy="258" rx="160" ry="12" fill="#1C1F24" opacity=".08"/>
  <!-- Hard hat -->
  <g transform="translate(40 70)">
    <path d="M20 112 a90 90 0 0 1 180 0 z" fill="#F5A300"/>
    <path d="M96 24 a90 90 0 0 1 28 0 v88 h-28 z" fill="#FFC64D"/>
    <rect x="0" y="108" width="220" height="20" rx="10" fill="#D98F00"/>
    <path d="M44 70 a70 70 0 0 1 30 -36" fill="none" stroke="#FFD27A" stroke-width="6" stroke-linecap="round"/>
  </g>
  <!-- Safety goggles -->
