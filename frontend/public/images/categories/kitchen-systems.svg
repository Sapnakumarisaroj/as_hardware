    <rect x="8" y="8" width="26" height="64" rx="4" fill="#F7F4EE"/>
    <rect x="39" y="8" width="26" height="64" rx="4" fill="#F7F4EE"/>
    <rect x="70" y="8" width="26" height="64" rx="4" fill="#F7F4EE"/>
    <g fill="#9AA3AD">
      <rect x="18" y="16" width="6" height="48" rx="3"/><ellipse cx="21" cy="18" rx="6" ry="8"/>
      <rect x="49" y="16" width="6" height="48" rx="3"/>
