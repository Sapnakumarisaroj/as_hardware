    <line x1="112" y1="128" x2="112" y2="228"/><line x1="132" y1="128" x2="132" y2="228"/>
    <line x1="152" y1="128" x2="152" y2="228"/><line x1="172" y1="128" x2="172" y2="228"/>
    <line x1="192" y1="128" x2="192" y2="228"/><line x1="212" y1="128" x2="212" y2="228"/>
