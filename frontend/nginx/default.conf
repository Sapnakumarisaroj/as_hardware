# AS Hardware: the React site, plus the Django API on the same domain (docker-compose.prod.yml).
# Caddy terminates HTTPS and forwards here; Django (gunicorn) is reachable only on the internal network.

server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    # Docker's DNS, re-resolved every 10 s: a restarted backend container (new IP) is found without reloading nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $django http://backend:8000;

    # Largest request Django accepts (MAX_REQUEST_BYTES, 12 MB: photo search, proof photos, imports).
    client_max_body_size 12m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    include /etc/nginx/snippets/security-headers.conf;

    # Container health check (no Django involved).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Django: API, admin, its own static files (served by WhiteNoise), and the sitemap.
    location /api/ {
        proxy_pass $django;
        include /etc/nginx/snippets/proxy-params.conf;
    }
    location /django-admin/ {
        proxy_pass $django;
        include /etc/nginx/snippets/proxy-params.conf;
    }
    location /static/ {
        proxy_pass $django;
        include /etc/nginx/snippets/proxy-params.conf;
    }
    location = /sitemap.xml {
        proxy_pass $django/api/seo/sitemap.xml;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    # Public uploads (product pictures). Private files (proof photos) live in another volume nginx never sees.
    location /media/ {
        alias /srv/media/;
        autoindex off;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800";
        location ~* \.(php|py|pl|cgi|sh|html?|svg|js)$ {
            return 404;
        }
    }

    # Hashed build files never change: cache for a year.
    location /assets/ {
        try_files $uri =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The app shell must always be fresh so a new release is picked up.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # Single-page app: unknown paths (e.g. /products/123, /admin) load index.html.
    location / {
        try_files $uri /index.html;
    }
}
