# Forwarding to Django. Caddy (in front) sets X-Forwarded-Proto=https and the client address in X-Forwarded-For;
# this hop appends Caddy's address, so Django's TRUSTED_PROXY_COUNT is 2.
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
proxy_read_timeout 65s;
proxy_redirect off;
# nginx sets these for every response (security-headers.conf); drop Django's copies to avoid duplicates.
proxy_hide_header X-Frame-Options;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Strict-Transport-Security;
