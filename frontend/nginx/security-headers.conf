# Included in every location that sets its own headers (nginx drops inherited add_header otherwise).
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
# Camera (rider proof photo), microphone (voice search) and location (address pin) for this site only.
# payment: the browser Payment Request API, which Razorpay Checkout (its iframe on api.razorpay.com) uses for
# Google Pay / UPI apps on Chrome for Android. "payment=()" switched it off everywhere and broke those methods.
add_header Permissions-Policy 'camera=(self), microphone=(self), geolocation=(self), payment=(self "https://api.razorpay.com" "https://checkout.razorpay.com")' always;
# HTTPS is terminated by Caddy in front; one year, this host only (no includeSubDomains / preload).
add_header Strict-Transport-Security "max-age=31536000" always;
